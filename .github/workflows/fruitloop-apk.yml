name: Build Fruitloop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack Fruitloop project
        run: |
          unzip -q Fruitloop-V2.zip -d project
          cd project/fruitloop
          echo "Project contents:"
          find . -maxdepth 2 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: project/fruitloop
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruitloop-debug-apk
          path: project/fruitloop/app/build/outputs/apk/debug/app-debug.apk
